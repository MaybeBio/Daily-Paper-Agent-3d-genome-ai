# 课题短名，用于产出文件名与 Issue 标题
# 三维基因组/染色质组织/染色质结构 × 计算（AI ∪ 分子模拟）
# 对象 = 3D 基因组/染色质组织 
# 方法 = 深度学习等 AI ∪ 分子动力学/模拟
topic: 3d-genome-ai

# 站点显示名（页头品牌 + 各页 <title>），与 topic(slug) 分开；换课题时改这里
title: 三维基因组 × AI

# 抓取时间窗口（天），每周自动跑默认 7；手动跑可改 1
window_days: 7

# GitHub Pages 站点根地址，用于 Issue「链接」列的绝对跳转（解析页）
site_base_url: https://MaybeBio.github.io/Daily-Paper-Agent-3d-genome-ai

# 搜索框占位提示词（站点文案，换课题时改成新领域示例词）
search_placeholder: 如 三维基因组、染色质组织、染色质结构、Hi-C、ChIA-PET、loop extrusion模拟
  
# LLM agent：模型 / base_url / api_key 全部从环境变量读取，不写进文件
#   LLM_BASE_URL / LLM_API_KEY / LLM_MODEL 由 GitHub Actions secrets/variables 或本地 env 注入
llm:
  enable_card: true
  enable_reviewer: true
  # LLM 并发数（线程池大小）。顺序跑 80+ 篇 × 3 次调用会超过 GitHub Actions 6h 上限，
  # 并发跑可把墙钟时间压到几十分钟。按网关 QPS 承受力调，默认 8。
  concurrency: 8
  # 评分阈值：score >= min_score 才生成 Paper Card + Reviewer 报告；低于则只保留
  # 评分 + 一句话 + 摘要(翻译)。对应评分分档 0-4/5-7/8-10，5 为「部分命中」入口。
  min_score: 5

# PubMed 的 ENTREZ_EMAIL（必填）/ NCBI_API_KEY（可选）从环境变量读，不写进文件
#   GitHub Actions：repo Settings → Secrets and variables → Actions
#   本地：export ENTREZ_EMAIL=you@example.com ，export NCBI_API_KEY=...

platforms:
  pubmed:
    # 对象 × 方法，两段式。Mesh 受标引时滞影响（最新文献不及时），周窗召回主要靠 tiab firing
    # 3D 基因组/染色质组织）：染色质结构/凝聚体相关 Mesh + Hi-C/3C、TAD、loop、CTCF/cohesin、
    # A/B compartment、nuclear organization 等 tiab —— 词本身精确、几乎不带预后噪声
    query: >
      ( "Chromatin"[Mesh]
      OR "Chromatin Assembly and Disassembly"[Mesh]
      OR "Nucleosomes"[Mesh]
      OR "CCCTC-Binding Factor"[Mesh]
      OR "Cohesins"[Mesh]
      OR "Chromosomal Proteins, Non-Histone"[Mesh]
      OR "3D genome*"[tiab]
      OR "three-dimensional genome"[tiab]
      OR "genome organization"[tiab]
      OR "genome architecture"[tiab]
      OR "genome folding"[tiab]
      OR "nuclear organization"[tiab]
      OR "nuclear architecture"[tiab]
      OR "chromatin organization"[tiab]
      OR "chromatin architecture"[tiab]
      OR "chromatin conformation"[tiab]
      OR "chromatin topology"[tiab]
      OR "chromatin structure*"[tiab]
      OR "chromatin loop*"[tiab]
      OR "chromatin interaction*"[tiab]
      OR "chromatin domain*"[tiab]
      OR "topologically associating domain*"[tiab]
      OR "A/B compartment*"[tiab]
      OR "chromosome conformation capture"[tiab]
      OR "Hi-C"[tiab]
      OR HiChIP[tiab]
      OR "loop extrusion"[tiab]
      OR "loop-extrusion"[tiab]
      OR CTCF[tiab]
      OR cohesin*[tiab]
      OR "cis-regulatory"[tiab]
      OR "cis-regulatory element*"[tiab]
      OR "regulatory element*"[tiab]
      OR "regulatory genomics"[tiab]
      OR "chromatin accessibility"[tiab]
      OR "enhancer-promoter"[tiab]
      OR "promoter-enhancer"[tiab])
      AND
      ( "Artificial Intelligence"[Mesh]
      OR "Deep Learning"[Mesh]
      OR "Machine Learning"[Mesh]
      OR "Neural Networks, Computer"[Mesh]
      OR "artificial intelligence"[tiab]
      OR "deep learning"[tiab]
      OR "machine learning"[tiab]
      OR "neural network*"[tiab]
      OR "graph neural network*"[tiab]
      OR "convolutional neural network*"[tiab]
      OR transformer*[tiab]
      OR "language model*"[tiab]
      OR "foundation model*"[tiab]
      OR "diffusion model*"[tiab]
      OR "generative*"[tiab]
      OR "flow matching"[tiab]
      OR alphafold*[tiab]
      OR esmfold*[tiab]
      OR rosetta*[tiab]
      OR "molecular dynamics"[tiab]
      OR simulation*[tiab]
      OR docking[tiab])
  arxiv:
    # arXiv 原生布尔：写 all: 字段形式原样透传（无 : 的纯词会被强制全 AND，OR 失效）
    # 对象短语与 3d-genome-ai pubmed tiab 同源（3D 基因组/染色质组织中心词；Mesh 无法入 arXiv 故省略），
    # 与 tf-dna-ai 互补：本腿含 调控元件/可及性/enhancer-promoter 等调控基因组短语，不含 TF–DNA 结合短语
    # max_results：native 后端不加会翻整周全部命中 → 限速挂起；精确周 100 足够
    max_results: 100
    query: >
      (all:"3D genome"
      OR all:"three-dimensional genome"
      OR all:"genome organization"
      OR all:"genome architecture"
      OR all:"genome folding"
      OR all:"nuclear organization"
      OR all:"nuclear architecture"
      OR all:"chromatin organization"
      OR all:"chromatin architecture"
      OR all:"chromatin conformation"
      OR all:"chromatin topology"
      OR all:"chromatin structure"
      OR all:"chromatin loop"
      OR all:"chromatin interaction"
      OR all:"chromatin domain"
      OR all:"topologically associating domain"
      OR all:"A/B compartment"
      OR all:"chromosome conformation capture"
      OR all:"Hi-C"
      OR all:HiChIP
      OR all:"loop extrusion"
      OR all:"loop-extrusion"
      OR all:CTCF
      OR all:cohesin
      OR all:"cis-regulatory"
      OR all:"cis-regulatory element"
      OR all:"regulatory element"
      OR all:"regulatory genomics"
      OR all:"chromatin accessibility"
      OR all:"enhancer-promoter"
      OR all:"promoter-enhancer")
      AND
      (all:"deep learning"
      OR all:"machine learning"
      OR all:"neural network"
      OR all:"graph neural network"
      OR all:"convolutional neural network"
      OR all:transformer
      OR all:"language model"
      OR all:"foundation model"
      OR all:"diffusion model"
      OR all:generative
      OR all:"flow matching"
      OR all:alphafold
      OR all:esmfold
      OR all:rosetta
      OR all:"molecular dynamics"
      OR all:simulation
      OR all:docking)
  biorxiv:
    # 括号两段式（对象 × 方法；纯短语、无字段前缀）
    #   为什么必须保留括号、不能改平铺 DNF：Europe PMC（Lucene）对无括号的 AND/OR 混排会拍平错乱
    #   → 括号两段式 = 把正确性押在 Europe PMC 上，是最优解
    #   Europe PMC 严格 + Crossref 超集 + 每周 Zotero 筛 = 最优，维持括号两段式
    # 对象短语与 3d-genome-ai pubmed tiab 同源（3D 基因组/染色质组织 ∪ 调控基因组中心词，Mesh 省略），
    #   与 tf-dna-ai 互补：含 调控元件/可及性/enhancer-promoter 等短语，不含 TF–DNA 结合短语
    query: >
      ("3D genome"
      OR "three-dimensional genome"
      OR "genome organization"
      OR "genome architecture"
      OR "genome folding"
      OR "nuclear organization"
      OR "nuclear architecture"
      OR "chromatin organization"
      OR "chromatin architecture"
      OR "chromatin conformation"
      OR "chromatin topology"
      OR "chromatin structure"
      OR "chromatin loop"
      OR "chromatin interaction"
      OR "chromatin domain"
      OR "topologically associating domain"
      OR "A/B compartment"
      OR "chromosome conformation capture"
      OR "Hi-C"
      OR HiChIP
      OR "loop extrusion"
      OR "loop-extrusion"
      OR CTCF
      OR cohesin
      OR "cis-regulatory"
      OR "cis-regulatory element"
      OR "regulatory element"
      OR "regulatory genomics"
      OR "chromatin accessibility"
      OR "enhancer-promoter"
      OR "promoter-enhancer")
      AND
      ("deep learning"
      OR "machine learning"
      OR "neural network"
      OR "graph neural network"
      OR "convolutional neural network"
      OR transformer
      OR "language model"
      OR "foundation model"
      OR "diffusion model"
      OR generative
      OR "flow matching"
      OR esmfold
      OR rosetta
      OR alphafold
      OR "molecular dynamics"
      OR simulation
      OR docking)
  medrxiv:
    # 与 bioRxiv 同串（同一 BioRxivFetcher，platform=medrxiv）
    # 混合：Europe PMC 严格 + Crossref 超集，
    # 每周 Zotero 筛（详见 bioRxiv 注释：为何不能改平铺 DNF、边界短语如何补齐）
    # 三维基因组计算在 medRxiv 本就稀疏，空属正常
    query: >
      ("3D genome"
      OR "three-dimensional genome"
      OR "genome organization"
      OR "genome architecture"
      OR "genome folding"
      OR "nuclear organization"
      OR "nuclear architecture"
      OR "chromatin organization"
      OR "chromatin architecture"
      OR "chromatin conformation"
      OR "chromatin topology"
      OR "chromatin structure"
      OR "chromatin loop"
      OR "chromatin interaction"
      OR "chromatin domain"
      OR "topologically associating domain"
      OR "A/B compartment"
      OR "chromosome conformation capture"
      OR "Hi-C"
      OR HiChIP
      OR "loop extrusion"
      OR "loop-extrusion"
      OR CTCF
      OR cohesin
      OR "cis-regulatory"
      OR "cis-regulatory element"
      OR "regulatory element"
      OR "regulatory genomics"
      OR "chromatin accessibility"
      OR "enhancer-promoter"
      OR "promoter-enhancer")
      AND
      ("deep learning"
      OR "machine learning"
      OR "neural network"
      OR "graph neural network"
      OR "convolutional neural network"
      OR transformer
      OR "language model"
      OR "foundation model"
      OR "diffusion model"
      OR generative
      OR "flow matching"
      OR alphafold
      OR esmfold
      OR rosetta
      OR "molecular dynamics"
      OR simulation
      OR docking)
  chemrxiv:
    # 与 bioRxiv 同串（ChemRxiv Crossref prefix 10.26434）。chemRxiv 只有 Crossref，Europe PMC 不收录
    # （实测前缀 10.26434 无命中）→ 括号两段式无法严格。是唯一无 Europe PMC 覆盖的，
    # 接受噪声，每周 Zotero 筛。不能改平铺 DNF（Europe PMC 会拍平错乱）
    query: >
      ("3D genome"
      OR "three-dimensional genome"
      OR "genome organization"
      OR "genome architecture"
      OR "genome folding"
      OR "nuclear organization"
      OR "nuclear architecture"
      OR "chromatin organization"
      OR "chromatin architecture"
      OR "chromatin conformation"
      OR "chromatin topology"
      OR "chromatin structure"
      OR "chromatin loop"
      OR "chromatin interaction"
      OR "chromatin domain"
      OR "topologically associating domain"
      OR "A/B compartment"
      OR "chromosome conformation capture"
      OR "Hi-C"
      OR HiChIP
      OR "loop extrusion"
      OR "loop-extrusion"
      OR CTCF
      OR cohesin
      OR "cis-regulatory"
      OR "cis-regulatory element"
      OR "regulatory element"
      OR "regulatory genomics"
      OR "chromatin accessibility"
      OR "enhancer-promoter"
      OR "promoter-enhancer")
      AND
      ("deep learning"
      OR "machine learning"
      OR "neural network"
      OR "graph neural network"
      OR "convolutional neural network"
      OR transformer
      OR "language model"
      OR "foundation model"
      OR "diffusion model"
      OR generative
      OR "flow matching"
      OR esmfold
      OR rosetta
      OR alphafold
      OR "molecular dynamics"
      OR simulation
      OR docking)
